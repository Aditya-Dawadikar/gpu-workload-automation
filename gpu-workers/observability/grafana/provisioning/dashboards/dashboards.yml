apiVersion: 1

# Each sub-directory becomes a Grafana folder:
#   gpu/ -> GPU cluster overview (this repo)
#   ray/ -> dashboards generated by Ray on the head node
providers:
  - name: cluster-dashboards
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
